name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Notifications.sln

      - name: Build
        run: dotnet build Notifications.sln --configuration ${{ matrix.configuration }} --no-restore --maxcpucount:1 --property:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Notifications.Tests/Notifications.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore --maxcpucount:1 --blame-hang-timeout 2m

      - name: Pack
        if: matrix.configuration == 'Release'
        run: dotnet pack Notifications/Notifications.csproj --configuration Release --no-build --no-restore --output artifacts --maxcpucount:1

      - name: Smoke test NuGet package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./eng/SmokeTestPackage.ps1 -PackageDirectory ./artifacts -PackageVersion 1.1.0

      - name: Upload NuGet packages
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: NuGet packages
          path: artifacts/*.*nupkg
          if-no-files-found: error
